name: Verify Windows Java and Kotlin fixes

# Focused follow-up after the full test run uncovered Windows-specific setup issues.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/verify-windows-jvm.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-arm64:
    uses: ./.github/workflows/compile.yml
    with:
      language: java
      target: windows-arm64
    permissions:
      contents: read

  kotlin-x64:
    uses: ./.github/workflows/compile.yml
    with:
      language: kotlin
      target: windows-x64
    permissions:
      contents: read

  kotlin-arm64:
    uses: ./.github/workflows/compile.yml
    with:
      language: kotlin
      target: windows-arm64
    permissions:
      contents: read
