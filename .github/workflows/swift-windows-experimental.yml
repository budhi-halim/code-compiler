name: Verify Windows Swift via main compiler

# A focused integration check for the main reusable compiler workflow.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/swift-windows-experimental.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-windows-x64:
    uses: ./.github/workflows/compile.yml
    with:
      language: swift
      target: windows-x64
    permissions:
      contents: read

  swift-windows-arm64:
    uses: ./.github/workflows/compile.yml
    with:
      language: swift
      target: windows-arm64
    permissions:
      contents: read
